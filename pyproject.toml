[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mountaincar-ppo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["gymnasium[classic-control]>=0.29,<2", "numpy>=1.24,<3", "torch>=2.15,<3", "matplotlib>=3.7,<4", "imageio[ffmpeg]>=2.31,<3"]

[tool.setuptools.packages.find]
include = ["mountaincar*"]
